name: Build Pasargad VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Base Flutter App
        run: |
          rm -rf * .github
          mkdir -p .github/workflows
          flutter create --platforms=android --org com.pasargad pasargad_vpn
          cp -r pasargad_vpn/* .
          rm -rf pasargad_vpn

      - name: Add Dependencies
        run: |
          flutter pub add flutter_riverpod dio flutter_secure_storage wireguard_flutter crypto

      - name: Configure Android
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pasargad-VPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
