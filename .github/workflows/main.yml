                final password = saved['password'];
                if (username != null && username.isNotEmpty && password != null && password.isNotEmpty) {
                  final session = await _apiService.loginAndFetchConfig(username: username, password: password);
                  await _storageService.saveClientSession(
                    username: username,
                    password: password,
                    token: session.accessToken,
                    wgConfig: session.wgQuickConfig,
                    serverAddress: session.serverEndpoint,
                  );
                  state = state.copyWith(isLoadin
