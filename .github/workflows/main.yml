name: Build Pasargad VPN APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Setup Project via Python Generator
        run: |
          python3 -c "
          import urllib.request, base64, os, re

          # 1. pubspec.yaml
          pubspec = '''name: pasargad_vpn
          description: Custom Android WireGuard VPN
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.6.1
            dio: ^5.7.0
            flutter_secure_storage: ^9.2.2
            wireguard_flutter: ^0.1.3
            crypto: ^3.0.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
          flutter:
            uses-material-design: true
          '''
          with open('pubspec.yaml', 'w') as f:
              f.write(pubspec)
          "

      - name: Initialize Android Platform
        run: |
          flutter create --platforms=android --org com.pasargad --project-name pasargad_vpn .

      - name: Inject Android Manifest and Dart Source
        run: |
          python3 - << 'PYTHONSCRIPT'
          import os, re

          manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SYSTEM_EXEMPTED" />
              <application
                  android:label="Pasargad VPN"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name="billion.group.wireguard_flutter.WgVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>'''

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          os.makedirs(os.path.dirname(manifest_path), exist_ok=True)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          for g in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(g):
                  with open(g, "r", encoding="utf-8") as f:
                      content = f.read()
                  content = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", content)
                  content = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", content)
                  with open(g, "w", encoding="utf-8") as f:
                      f.write(content)

          code = {}
          code["lib/core/constants/app_constants.dart"] = """class AppConstants {
            AppConstants._();
            static const String baseUrl = 'https://panel.pasargad-vpn.example.com/api/v1';
            static const String panelAdminApiKey = 'PASARGAD_PANEL_ADMIN_SECRET_BEARER_KEY';
            static const String adminMasterPassword = r'P@s$w0rd_Admin_Pasargad!2026#X';
            static const String wgInterfaceName = 'wg_pasargad0';
            static const String keyClientUsername = 'pasargad_client_username';
            static const String keyClientPassword = 'pasargad_client_password';
            static const String keyClientAccessToken = 'pasargad_client_jwt_token';
            static const String keyCachedWgConfig = 'pasargad_cached_wg_conf';
            static const String keyCachedServerAddress = 'pasargad_cached_endpoint';
          }"""

          code["lib/core/storage/secure_storage_service.dart"] = """import 'package:flutter_secure_storage/flutter_secure_storage.dart';
          import '../constants/app_constants.dart';

          class SecureStorageService {
            final FlutterSecureStorage _storage = const FlutterSecureStorage(
              aOptions: AndroidOptions(encryptedSharedPreferences: true),
            );

            Future<void> saveClientSession({
              required String username,
              required String password,
              required String token,
              required String wgConfig,
              required String serverAddress,
            }) async {
              await Future.wait([
                _storage.write(key: AppConstants.keyClientUsername, value: username),
                _storage.write(key: AppConstants.keyClientPassword, value: password),
                _storage.write(key: AppConstants.keyClientAccessToken, value: token),
                _storage.write(key: AppConstants.keyCachedWgConfig, value: wgConfig),
                _storage.write(key: AppConstants.keyCachedServerAddress, value: serverAddress),
              ]);
            }

            Future> getSavedCredentials() async {
              final results = await Future.wait([
                _storage.read(key: AppConstants.keyClientUsername),
                _storage.read(key: AppConstants.keyClientPassword),
                _storage.read(key: AppConstants.keyClientAccessToken),
                _storage.read(key: AppConstants.keyCachedWgConfig),
                _storage.read(key: AppConstants.keyCachedServerAddress),
              ]);
              return {
                'username': results[0],
                'password': results[1],
                'token': results[2],
                'wgConfig': results[3],
                'serverAddress': results[4],
              };
            }

            Future<void> clearClientSession() async {
              await _storage.deleteAll();
            }
          }"""

          code["lib/data/models/user_session_model.dart"] = """class UserSessionModel {
            final String username;
            final String accessToken;
            final String wgQuickConfig;
            final String serverEndpoint;
            final int dataLimitBytes;
            final int dataUsedBytes;
            final bool isActive;

            const UserSessionModel({
              required this.username,
              required this.accessToken,
              required this.wgQuickConfig,
              required this.serverEndpoint,
              required this.dataLimitBytes,
              required this.dataUsedBytes,
              required this.isActive,
            });

            int get remainingBytes => (dataLimitBytes - dataUsedBytes).clamp(0, dataLimitBytes);
            double get remainingGb => remainingBytes / (1024 * 1024 * 1024);
            double get totalGb => dataLimitBytes / (1024 * 1024 * 1024);
            double get usedGb => dataUsedBytes / (1024 * 1024 * 1024);
            double get usageRatio => dataLimitBytes > 0 ? (dataUsedBytes / dataLimitBytes).clamp(0.0, 1.0) : 0.0;

            factory UserSessionModel.fromJson(Map<String, dynamic> json, {String? fallbackToken}) {
              final String rawWgConfig = (json['wireguard_config'] ?? json['wg_config'] ?? '') as String;
              final String endpoint = (json['server_endpoint'] ?? _extractEndpoint(rawWgConfig) ?? '127.0.0.1:51820').toString();
              return UserSessionModel(
                username: (json['username'] ?? '') as String,
                accessToken: (json['access_token'] ?? fallbackToken ?? '') as String,
                wgQuickConfig: rawWgConfig,
                serverEndpoint: endpoint,
                dataLimitBytes: (json['data_limit_bytes'] ?? json['data_limit'] ?? 0) as int,
                dataUsedBytes: (json['data_used_bytes'] ?? json['used_traffic'] ?? 0) as int,
                isActive: (json['status'] ?? 'active') == 'active',
              );
            }

            static String? _extractEndpoint(String config) {
              final RegExp regex = RegExp(r'Endpoint\\s*=\\s*([^\\s\\r\\n]+)', caseSensitive: false);
              return regex.firstMatch(config)?.group(1);
            }
          }"""

          code["lib/data/models/create_user_request.dart"] = """class CreateUserRequest {
            final String username;
            final String password;
            final int dataLimitGb;

            const CreateUserRequest({
              required this.username,
              required this.password,
              required this.dataLimitGb,
            });

            int get dataLimitBytes => dataLimitGb * 1024 * 1024 * 1024;

            Map<String, dynamic> toJson() {
              return {
                'username': username.trim(),
                'password': password,
                'protocol': 'wireguard',
                'data_limit': dataLimitBytes,
                'data_limit_gb': dataLimitGb,
                'status': 'active',
                'inbounds': {
                  'wireguard': ['WG_MAIN_INBOUND'],
                },
              };
            }
          }"""

          code["lib/data/services/pasargad_api_service.dart"] = """import 'package:dio/dio.dart';
          import '../../core/constants/app_constants.dart';
          import '../models/create_user_request.dart';
          import '../models/user_session_model.dart';

          class PasargadApiException implements Exception {
            final String message;
            final int? statusCode;
            const PasargadApiException(this.message, {this.statusCode});
            @override
            String toString() => message;
          }

          class PasargadApiService {
            late final Dio _dio;

            PasargadApiService() {
              _dio = Dio(
                BaseOptions(
                  baseUrl: AppConstants.baseUrl,
                  connectTimeout: const Duration(seconds: 12),
                  receiveTimeout: const Duration(seconds: 12),
                  headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
                ),
              );
            }

            Future<UserSessionModel> loginAndFetchConfig({required String username, required String password}) async {
              try {
                final response = await _dio.post('/client/auth/login', data: {'username': username.trim(), 'password': password});
                if (response.statusCode == 200 && response.data != null) {
                  final data = response.data is Map<String, dynamic> ? response.data as Map<String, dynamic> : (response.data['data'] as Map<String, dynamic>);
                  return UserSessionModel.fromJson(data);
                }
                throw PasargadApiException('Unexpected server response (${response.statusCode})', statusCode: response.statusCode);
              } on DioException catch (e) {
                throw _handleDioError(e, defaultMsg: 'Failed to authenticate with Pasargad Panel.');
              }
            }

            Future<UserSessionModel> fetchUserStatus({required String accessToken, required String username}) async {
              try {
                final response = await _dio.get('/client/user/$username/status', options: Options(headers: {'Authorization': 'Bearer $accessToken'}));
                if (response.statusCode == 200 && response.data != null) {
                  final data = response.data is Map<String, dynamic> ? response.data as Map<String, dynamic> : (response.data['data'] as Map<String, dynamic>);
                  return UserSessionModel.fromJson(data, fallbackToken: accessToken);
                }
                throw PasargadApiException('Failed to fetch user traffic status.', statusCode: response.statusCode);
              } on DioException catch (e) {
                throw _handleDioError(e, defaultMsg: 'Unable to sync quota with Pasargad Panel.');
              }
            }

            Future> createWireGuardUser(CreateUserRequest request) async {
              try {
                final response = await _dio.post(
                  '/admin/users/create',
                  data: request.toJson(),
                  options: Options(headers: {'Authorization': 'Bearer ${AppConstants.panelAdminApiKey}'}),
                );
                if (response.statusCode == 200 || response.statusCode == 201) {
                  return response.data is Map<String, dynamic> ? response.data as Map<String, dynamic> : {'status': 'created', 'username': request.username};
                }
                throw PasargadApiException('Failed to create user (HTTP ${response.statusCode})', statusCode: response.statusCode);
              } on DioException catch (e) {
                throw _handleDioError(e, defaultMsg: 'Could not create user on Pasargad Panel.');
              }
            }

            PasargadApiException _handleDioError(DioException e, {required String defaultMsg}) {
              final statusCode = e.response?.statusCode;
              final responseData = e.response?.data;
              String serverMessage = defaultMsg;
              if (responseData is Map<String, dynamic>) {
                serverMessage = (responseData['detail'] ?? responseData['message'] ?? responseData['error'] ?? defaultMsg).toString();
              } else if (e.type == DioExceptionType.connectionTimeout || e.type == DioExceptionType.receiveTimeout) {
                serverMessage = 'Connection to Pasargad Panel timed out.';
              } else if (e.type == DioExceptionType.connectionError) {
                serverMessage = 'Cannot reach Pasargad Panel server.';
              }
              return PasargadApiException(serverMessage, statusCode: statusCode);
            }
          }"""

          code["lib/data/services/wireguard_vpn_service.dart"] = """import 'dart:async';
          import 'package:wireguard_flutter/wireguard_flutter.dart';
          import 'package:wireguard_flutter/wireguard_flutter_platform_interface.dart';
          import '../../core/constants/app_constants.dart';

          class WireGuardVpnService {
            final WireGuardFlutterInterface _wireguard = WireGuardFlutter.instance;
            bool _isInitialized = false;

            Stream<VpnStage> get vpnStageStream => _wireguard.vpnStageSnapshot;

            Future<void> ensureInitialized() async {
              if (_isInitialized) return;
              await _wireguard.initialize(interfaceName: AppConstants.wgInterfaceName);
              _isInitialized = true;
            }

            Future<void> connect({required String wgQuickConfig, required String serverEndpoint}) async {
              await ensureInitialized();
              if (wgQuickConfig.trim().isEmpty) {
                throw Exception('WireGuard configuration string is empty.');
              }
              await _wireguard.startVpn(
                serverAddress: serverEndpoint,
                wgQuickConfig: wgQuickConfig,
                providerBundleIdentifier: 'com.pasargad.vpn.wg',
              );
            }

            Future<void> disconnect() async {
              await ensureInitialized();
              await _wireguard.stopVpn();
            }

            Future<VpnStage> getCurrentStage() async {
              await ensureInitialized();
              return await _wireguard.stage();
            }
          }"""

          code["lib/providers/auth_provider.dart"] = """import 'package:flutter_riverpod/flutter_riverpod.dart';
          import '../core/constants/app_constants.dart';
          import '../core/storage/secure_storage_service.dart';
          import '../data/models/create_user_request.dart';
          import '../data/models/user_session_model.dart';
          import '../data/services/pasargad_api_service.dart';

          final secureStorageProvider = Provider<SecureStorageService>((ref) => SecureStorageService());
          final pasargadApiProvider = Provider<PasargadApiService>((ref) => PasargadApiService());

          class AuthState {
            final bool isLoading;
            final bool isAdminAuthenticated;
            final UserSessionModel? clientSession;
            final String? errorMessage;

            const AuthState({
              this.isLoading = false,
              this.isAdminAuthenticated = false,
              this.clientSession,
              this.errorMessage,
            });

            AuthState copyWith({
              bool? isLoading,
              bool? isAdminAuthenticated,
              UserSessionModel? clientSession,
              bool clearClientSession = false,
              String? errorMessage,
            }) {
              return AuthState(
                isLoading: isLoading ?? this.isLoading,
                isAdminAuthenticated: isAdminAuthenticated ?? this.isAdminAuthenticated,
                clientSession: clearClientSession ? null : (clientSession ?? this.clientSession),
                errorMessage: errorMessage,
              );
            }
          }

          class AuthNotifier extends StateNotifier<AuthState> {
            final PasargadApiService _apiService;
            final SecureStorageService _storageService;

            AuthNotifier(this._apiService, this._storageService) : super(const AuthState()) {
              restoreSavedSession();
            }

            Future<void> restoreSavedSession() async {
              state = state.copyWith(isLoading: true, errorMessage: null);
              try {
                final saved = await _storageService.getSavedCredentials();
